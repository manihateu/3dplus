name: 3dplus

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/manihateu/3dplus:latest}
    container_name: 3dplus-web
    restart: unless-stopped
    init: true
    ports:
      # Порт на сервере можно поменять через APP_PORT в .env
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      # Кэш ISR и оптимизированных картинок переживает перезапуск контейнера
      - next-cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  next-cache:
